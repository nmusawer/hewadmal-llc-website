<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hewadmal Group LLC</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background-color: #808080;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #ffffff;
  }
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-size: 2.4rem;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  p.tagline {
    font-size: 1.3rem;
    font-weight: 300;
    margin-bottom: 40px;
    color: #f0f0f0;
  }
  .coming-soon {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #e0e0e0;
    margin-bottom: 60px;
  }
  footer {
    position: absolute;
    bottom: 32px;
    text-align: center;
    font-size: 0.95rem;
    color: #f0f0f0;
  }
  footer a {
    color: #ffffff;
    text-decoration: none;
  }
  footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="page">
    <h1>HEWADMAL GROUP LLC</h1>
    <p class="tagline">Shop Smart, Live Well</p>

  <footer>
